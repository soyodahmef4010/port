function useTyping() {
  const [i, setI] = useState(0), [t, setT] = useState(""), [del, setDel] = useState(false);
  useEffect(() => {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) { setT(ROLES[0]); return; }
    const w = ROLES[i];
    const id = setTimeout(() => {
      if (!del && t === w) return setDel(true);
      if (del && t === "") { setDel(false); return setI((i + 1) % ROLES.length); }
      setT(del ? w.slice(0, t.length - 1) : w.slice(0, t.length + 1));
    }, !del && t === w ? 1400 : del ? 35 : 70);
    return () => clearTimeout(id);
  }, [t, del, i]);
  return t;
}

function Decrypt({ text }) {
  const [t, setT] = useState(text);
  useEffect(() => {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const set = "ABCDEF0123456789#$%&*<>/"; let f = 0;
    const id = setInterval(() => {
      f++; const k = Math.floor(f / 3);
      if (k >= text.length) { clearInterval(id); setT(text); return; }
      setT(text.split("").map((c, i) => (c === " " || i < k ? c : set[Math.floor(Math.random() * set.length)])).join(""));
    }, 40);
    return () => clearInterval(id);
  }, [text]);
  return <><span className="sr-only">{text}</span><span aria-hidden="true">{t}</span></>;
}

}

    const ep = CONFIG.formEndpoint || "";

    setSending(true); setMsg(null);
    try {
      const r = await fetch(CONFIG.formEndpoint, { method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" }, body: JSON.stringify({ ...f, _subject: "Portfolio message: " + f.subject }) });
      if (!r.ok) throw new Error();
      setMsg({ ok: true, t: "Message sent. Thank you!" }); setF({ name: "", email: "", subject: "", message: "" });

let ADMIN_ART = null, ADMIN_DB = null;
const ADMIN_HASH = "1ee7e14ccc8d28cc0356e41996220140976952eb65dff986bc4ebb8f26b3d858";
const csv = s => s.split(",").map(t => t.trim()).filter(Boolean);

const BT = "rounded-md border border-mute/25 px-2 py-1 text-xs text-mute hover:border-accent hover:text-accent disabled:opacity-30";

function buildHtml(data) {
  const head = Array.from(document.head.querySelectorAll('meta[charset],meta[name],meta[property],title,link[href^="https://fonts."],script[src^="https://cdn.tailwindcss.com"],style#base-css,script#tw-config')).map(el => el.outerHTML);
  const libs = Array.from(document.querySelectorAll('script[src^="https://cdnjs.cloudflare.com/ajax/libs/"]')).map(el => el.outerHTML);
  const app = document.getElementById("app-src").outerHTML;
  const json = JSON.stringify(data).replace(/</g, "\\u003c");
  return "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n" + Array.from(new Set(head)).join("\n") + "\n</head>\n<body>\n<div id=\"root\"></div>\n<script id=\"site-data\" type=\"application/json\">" + json + "</" + "script>\n" + libs.join("\n") + "\n" + app + "\n</body>\n</html>";
}

const Fld = ({ label, v, on, area }) => (
  <label className="mt-3 block text-xs text-mute">{label}

      ? <textarea key={v} rows="3" defaultValue={v} className={INP} onBlur={e => e.target.value !== v && on(e.target.value)} />

const Row = ({ title, i, n, mv, del, children }) => {

        <span className="flex shrink-0 gap-1" onClick={e => e.preventDefault()}>
          <button type="button" className={BT} disabled={i === 0} onClick={() => mv(-1)} aria-label="Move up">Up</button>
          <button type="button" className={BT} disabled={i === n - 1} onClick={() => mv(1)} aria-label="Move down">Down</button>
          <button type="button" className={BT} onClick={() => (sure ? del() : setSure(true))} onBlur={() => setSure(false)}>{sure ? "Sure?" : "Delete"}</button>

      </summary>
      {children}

  );
};

function Admin({ onClose, onChange }) {
  const snap = () => ({ config: CONFIG, projects: PROJECTS, skills: SKILLS, steps: STEPS, ach: ACH });
  const [d, setD] = useState(() => JSON.parse(JSON.stringify(snap())));
  const [gate, setGate] = useState("checking");
  const [tab, setTab] = useState("projects");
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);
  const [authed, setAuthed] = useState(() => { try { return sessionStorage.getItem("adm") === "1"; } catch (e) { return false; } });
  const [lf, setLf] = useState({ u: "", p: "" });
  const [lerr, setLerr] = useState("");
  const [fails, setFails] = useState(0);
  const [lockUntil, setLockUntil] = useState(0);
  const logRef = React.useRef([]);
  const timer = React.useRef(null);
  const [log, setLog] = useState([]);
  const [saved, setSaved] = useState(null);
  const [dbNote, setDbNote] = useState("");
  const login = async e => {
    e.preventDefault();
    if (Date.now() < lockUntil) return setLerr("Too many attempts. Wait 30 seconds and try again.");
    try {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(lf.u.trim() + ":" + lf.p));
      const hex = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
      if (hex === ADMIN_HASH) { try { sessionStorage.setItem("adm", "1"); } catch (x) {} setAuthed(true); setLerr(""); setFails(0); }
      else {
        const n = fails + 1;
        if (n >= 5) { setLockUntil(Date.now() + 30000); setFails(0); setLerr("Too many attempts. Wait 30 seconds and try again."); }
        else { setFails(n); setLerr("Wrong username or password."); }
      }
    } catch (x) { setLerr("Sign-in isn’t available in this browser context."); }
  };

  const check = async () => {
    setGate("checking");
    try {
      const c = window.claude;
      const u = c && await c.use("user");
      const a = c && await c.use("artifact");
      const ok = u && a && ((await u.isOwner()) || (await u.canEdit()));
      ADMIN_ART = a;
      if (ok) {
        try {
          const dbn = await c.use("db"); const uid = await u.id();
          ADMIN_DB = dbn && uid ? dbn.collection("data/users/" + uid) : null;
          if (ADMIN_DB) { const s = await ADMIN_DB.doc("state").get(); if (s.exists) { const v = s.data(); logRef.current = v.log || []; setLog(logRef.current); setSaved(v); } }
          else setDbNote("Database unavailable: drafts aren’t saved.");
        } catch (e) { ADMIN_DB = null; setDbNote("Database unavailable: drafts aren’t saved."); }
      }
      setGate(ok ? "ok" : "denied");
    } catch (e) { setGate("denied"); }
  };
  useEffect(() => { check(); }, []);

  const persist = (n, label, now) => {
    logRef.current = [{ t: Date.now(), s: label }, ...logRef.current].slice(0, 60);
    setLog(logRef.current);
    if (!ADMIN_DB) return Promise.resolve();
    const save = async () => {
      try { await ADMIN_DB.doc("state").set({ draft: JSON.stringify(n), log: logRef.current, savedAt: Date.now() }); setDbNote("Saved to database at " + new Date().toLocaleTimeString()); }
      catch (e) { setDbNote("Couldn’t save to the database."); }
    };
    clearTimeout(timer.current);
    if (now) return save();
    setDbNote("Saving…");
    timer.current = setTimeout(save, 1200);
    return Promise.resolve();
  };
  const mut = (fn, label) => {
    const n = JSON.parse(JSON.stringify(d));
    fn(n); setD(n);
    CONFIG = n.config; PROJECTS = n.projects; SKILLS = n.skills; STEPS = n.steps; ACH = n.ach;
    onChange(); persist(n, label || "Edited " + tab);
  };
  const publish = async () => {
    setBusy(true); setMsg("");
    try { await persist(d, "Published changes", true); await ADMIN_ART.publish(buildHtml(d)); setMsg("Published. Reloading the page…"); }
    catch (e) {
      const m = { conflict: "A newer version was published, so the page is reloading.", not_writer: "This account can’t edit the page.", not_granted: "This account can’t edit the page.", too_large: "The page is too large to save.", rate_limited: "You’re saving too often. Wait a moment and try again." };
      setMsg(m[e && e.code] || "Couldn’t publish. Your edits are still here; try again."); setBusy(false);
    }
  };

  const P = (i, k, f) => v => mut(c => { c.projects[i][k] = f ? f(v) : v; });
  const lim = { disabled: "", };
  const cfg = (k, label, f) => <Fld key={k} label={label} v={d.config[k] || ""} on={v => mut(c => { c.config[k] = f ? f(v) : v.trim(); })} />;

  return (
    <div className="fixed inset-0 z-50 flex justify-end bg-black/60" role="dialog" aria-modal="true" aria-label="Admin panel" style={{ paddingTop: "env(safe-area-inset-top, 0px)" }}>
      <div className="flex h-full w-full max-w-xl flex-col border-l border-mute/20 bg-panel" style={{ paddingBottom: "env(safe-area-inset-bottom, 0px)" }}>
        <div className="flex items-center justify-between border-b border-mute/15 px-5 py-4">
          <h2 className="font-head text-lg font-bold">Admin panel</h2>
          <span className="flex gap-2">
            {authed && gate === "ok" && <button type="button" className={BT} onClick={() => { try { sessionStorage.removeItem("adm"); } catch (x) {} setAuthed(false); setLf({ u: "", p: "" }); }}>Log out</button>}
            <button type="button" className={BT} onClick={onClose}>Close</button>
          </span>
        </div>

        {gate === "checking" && <p className="p-5 text-mute">Checking your sign-in…</p>}

        {gate === "denied" && (
          <div className="p-5 text-sm leading-relaxed text-mute">
            <h3 className="font-head text-base font-bold text-ink">Admin sign-in required</h3>
            <p className="mt-2">Only the owner of this portfolio can edit it. Sign in to Claude with the owner account, open this page from your Claude artifacts, then check again.</p>
            <button type="button" className={BT + " mt-4 px-3 py-2 text-sm"} onClick={check}>Check again</button>
          </div>
        )}

        {gate === "ok" && !authed && (
          <form onSubmit={login} className="p-5">
            <h3 className="font-head text-base font-bold">Admin login</h3>
            <label className="mt-4 block text-xs text-mute">Username<input className={INP} autoComplete="username" value={lf.u} onChange={e => setLf({ ...lf, u: e.target.value })} /></label>
            <label className="mt-3 block text-xs text-mute">Password<input type="password" className={INP} autoComplete="current-password" value={lf.p} onChange={e => setLf({ ...lf, p: e.target.value })} /></label>
            {lerr && <p role="alert" className="mt-3 text-sm text-violet">{lerr}</p>}
            <button type="submit" className="mt-4 rounded-lg bg-accent px-4 py-2 text-sm font-medium text-bg hover:bg-sky-300">Log in</button>
          </form>
        )}

        {gate === "ok" && authed && (
          <>
            {saved && saved.draft && saved.draft !== JSON.stringify(snap()) && (
              <div className="flex flex-wrap items-center gap-3 border-b border-mute/15 bg-bg/60 px-5 py-3 text-sm">
                <span className="text-mute">Unpublished draft from {new Date(saved.savedAt).toLocaleString()}</span>
                <button type="button" className={BT} onClick={() => { const n = JSON.parse(saved.draft); setD(n); CONFIG = n.config; PROJECTS = n.projects; SKILLS = n.skills; STEPS = n.steps; ACH = n.ach; onChange(); setSaved(null); }}>Restore</button>
                <button type="button" className={BT} onClick={() => setSaved(null)}>Discard</button>
              </div>
            )}
            <div className="flex flex-wrap gap-2 border-b border-mute/15 px-5 py-3" role="tablist">
              {TABS.map(([k, l]) => <button key={k} type="button" role="tab" aria-selected={tab === k} onClick={() => setTab(k)} className={"rounded-md px-3 py-1.5 text-sm " + (tab === k ? "bg-accent text-bg" : "border border-mute/25 text-mute hover:text-accent")}>{l}</button>)}
            </div>
            <div className="flex-1 overflow-y-auto px-5 py-4">
              {tab === "projects" && <List d={d} mut={mut} get={c => c.projects} label={x => x.title} addText="Add project"

                  <Fld label="Title" v={x.title} on={P(i, "title")} />

                  <Fld label="Live demo URL (https://…)" v={x.demo} on={P(i, "demo", url)} />
                  <Fld label="Problem (optional)" area v={x.problem || ""} on={P(i, "problem")} />
                  <Fld label="Solution (optional)" area v={x.solution || ""} on={P(i, "solution")} />
                  <Fld label="Key features (comma separated, optional)" v={(x.features || []).join(", ")} on={P(i, "features", csv)} />
                </>)} />}

              {tab === "skills" && <List d={d} mut={mut} get={c => c.skills} label={x => x[0]} addText="Add skill category"
                blank={() => ["New category", []]}
                render={(x, i) => (<>
                  <Fld label="Category name" v={x[0]} on={v => mut(c => { c.skills[i][0] = v; })} />
                  <Fld label="Skills (comma separated; add “(Learning)” for in-progress)" area v={x[1].join(", ")} on={v => mut(c => { c.skills[i][1] = csv(v); })} />
                </>)} />}

              {tab === "journey" && <List d={d} mut={mut} get={c => c.steps} label={x => x[0] + " · " + x[1]} addText="Add step"
                blank={() => ["New step", "planned"]}
                render={(x, i) => (<>
                  <Fld label="Step" v={x[0]} on={v => mut(c => { c.steps[i][0] = v; })} />
                  <label className="mt-3 block text-xs text-mute">Status
                    <select key={x[1]} defaultValue={x[1]} className={INP} onChange={e => mut(c => { c.steps[i][1] = e.target.value; })}>
                      <option value="completed">Completed</option><option value="learning">Learning</option><option value="planned">Planned</option>
                    </select>
                  </label>
                </>)} />}

              {tab === "ach" && <List d={d} mut={mut} get={c => c.ach} label={x => x.t} addText="Add achievement"
                blank={() => ({ t: "New achievement", d: "" })}
                render={(x, i) => (<>
                  <Fld label="Title" v={x.t} on={v => mut(c => { c.ach[i].t = v; })} />
                  <Fld label="Details (issuer, year, verified info)" area v={x.d} on={v => mut(c => { c.ach[i].d = v; })} />
                </>)} />}

              {tab === "log" && (log.length ? <ul className="space-y-2 text-sm">{log.map((x, i) => <li key={i} className="flex justify-between gap-4 border-b border-mute/10 pb-2"><span>{x.s}</span><span className="shrink-0 text-mute">{new Date(x.t).toLocaleString()}</span></li>)}</ul> : <p className="text-sm text-mute">No activity yet. Your edits are logged here.</p>)}

              {tab === "links" && <div>
                {cfg("github", "GitHub profile URL", url)}
                {cfg("linkedin", "LinkedIn profile URL", url)}
                {cfg("email", "Email address")}
                {cfg("cv", "CV link (https://… or /_blob/…)", v => (/^(https?:\/\/|\/)/i.test(v.trim()) ? v.trim() : ""))}
                {cfg("formEndpoint", "Contact form endpoint (optional, for example Formspree)", url)}
              </div>}
            </div>
            <div className="border-t border-mute/15 px-5 py-4">
              <div className="flex flex-wrap items-center gap-3">
                <button type="button" disabled={busy} onClick={publish} className="rounded-lg bg-accent px-4 py-2 text-sm font-medium text-bg hover:bg-sky-300 disabled:opacity-50">{busy ? "Publishing…" : "Publish changes"}</button>
                {msg && <p role="status" className="text-sm text-violet">{msg}</p>}
              </div>
              <p className="mt-2 text-xs text-mute/80">Edits preview right away and autosave as a private draft in the database. Publish makes them live for every visitor.</p>
              {dbNote && <p className="mt-1 text-xs text-accent">{dbNote}</p>}
            </div>
          </>
        )}
      </div>
    </div>
  );
}

function App() {
  const [ver, setVer] = useState(0);
  const [admin, setAdmin] = useState(false);
  const [top, setTop] = useState(false);
  useEffect(() => { if (location.hash === "#admin") setAdmin(true); }, []);
  useEffect(() => {
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const root = document.documentElement;
    const bar = document.getElementById("bar");
    const onScroll = () => { setTop(scrollY > 600); const h = root.scrollHeight - innerHeight; if (bar) bar.style.transform = "scaleX(" + (h > 0 ? Math.min(scrollY / h, 1) : 0) + ")"; };
    const onMove = e => { root.style.setProperty("--gx", e.clientX + "px"); root.style.setProperty("--gy", e.clientY + "px"); const c = e.target.closest && e.target.closest(".card"); if (c) { const r = c.getBoundingClientRect(); c.style.setProperty("--mx", e.clientX - r.left + "px"); c.style.setProperty("--my", e.clientY - r.top + "px"); } };
    addEventListener("scroll", onScroll, { passive: true }); addEventListener("mousemove", onMove); onScroll();
    let io;
    if (!reduce && "IntersectionObserver" in window) {
      root.classList.add("anim");
      io = new IntersectionObserver(es => es.forEach(en => {
        if (!en.isIntersecting) return;
        const el = en.target, i = Array.from(el.parentElement.children).indexOf(el);
        el.style.transitionDelay = Math.min(i, 6) * 70 + "ms";
        el.setAttribute("data-in", "");
        setTimeout(() => { el.style.transitionDelay = ""; }, 1000);
        io.unobserve(el);
      }), { threshold: 0.1 });
      document.querySelectorAll("[data-r]:not([data-in]), .card:not([data-in])").forEach(el => io.observe(el));
    }
    return () => { removeEventListener("scroll", onScroll); removeEventListener("mousemove", onMove); io && io.disconnect(); };
  }, [ver]);
  return (
  <>
    <a href="#about" className="sr-only focus:not-sr-only focus:absolute focus:left-3 focus:top-3 focus:z-50 focus:rounded focus:bg-accent focus:px-3 focus:py-2 focus:text-bg">Skip to content</a>
    <Nav />
    <main><Hero /><Marquee /><About /><Skills /><Projects /><Education /><Journey key={ver} /><Achievements /><Contact /></main>
    <footer className="border-t border-mute/10 py-8 text-center text-sm text-mute">© 2026 Soyod Ahmed · Built with React and Tailwind CSS<div><button type="button" onClick={() => setAdmin(true)} className="mt-3 text-xs text-mute/60 hover:text-accent">Admin login</button></div></footer>
    {admin && <Admin onClose={() => setAdmin(false)} onChange={() => setVer(v => v + 1)} />}
    <div className="cursor-glow" aria-hidden="true" />
    <a href="#top" aria-label="Back to top" className={"fixed bottom-5 right-5 z-30 rounded-full border border-mute/30 bg-panel/90 p-3 text-accent backdrop-blur transition-all duration-300 hover:border-accent " + (top ? "translate-y-0 opacity-100" : "pointer-events-none translate-y-4 opacity-0")}><Icon n="up" /></a>
  </>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
